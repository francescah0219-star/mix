        // 获取所有唯一的城市列表
        function getUniqueCities() {
            const cities = [...new Set(companies.map(c => c.city))];
            return cities.sort();
        }

        // 初始化城市筛选器
        function initCityFilter() {
            const cities = getUniqueCities();
            const select = document.getElementById('cityFilter');
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                select.appendChild(option);
            });
        }

        // 渲染企业卡片
        function renderCompanies(filteredCompanies = companies) {
            const container = document.getElementById('companiesContainer');
            
            if (filteredCompanies.length === 0) {
                container.innerHTML = '<div class="no-results">🔍 没有找到匹配的企业</div>';
                return;
            }

            container.innerHTML = filteredCompanies.map((company, index) => `
                <div class="company-card">
                    <div class="company-header">
                        <div class="company-name">${company.name}</div>
                        <div class="company-badge">${getStatusText(company.status)}</div>
                    </div>
                    <div class="company-info">
                        <div class="info-item">
                            <div class="info-icon">📍</div>
                            <div class="info-content">
                                <div class="info-label">地址</div>
                                <div class="info-value">${company.address}</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">📞</div>
                            <div class="info-content">
                                <div class="info-label">电话</div>
                                <div class="info-value">${company.phone || '未提供'}</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">📧</div>
                            <div class="info-content">
                                <div class="info-label">邮箱</div>
                                <div class="info-value">${company.email ? `<a href="mailto:${company.email}">${company.email}</a>` : '未提供'}</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">🌐</div>
                            <div class="info-content">
                                <div class="info-label">官网</div>
                                <div class="info-value">${company.website ? `<a href="${company.website}" target="_blank">${company.website}</a>` : '未提供'}</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">💼</div>
                            <div class="info-content">
                                <div class="info-label">业务描述</div>
                                <div class="info-value">${company.business}</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">📊</div>
                            <div class="info-content">
                                <div class="info-label">企业类型</div>
                                <div class="info-value">${company.type === 'equipment' ? '设备供应商' : '混凝土生产商'}</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">📎</div>
                            <div class="info-content">
                                <div class="info-label">数据来源</div>
                                <div class="info-value"><a href="${company.source}" target="_blank">越南黄页</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 获取状态文本
        function getStatusText(status) {
            switch(status) {
                case 'active': return '✅ 活跃';
                case 'outdated': return '⚠️ 信息过时';
                case 'incorrect': return '❌ 信息有误';
                default: return '未知';
            }
        }

        // 更新统计数据
        function updateStats(filteredCompanies = companies) {
            document.getElementById('total-count').textContent = filteredCompanies.length;
            document.getElementById('with-phone').textContent = filteredCompanies.filter(c => c.phone).length;
            document.getElementById('with-email').textContent = filteredCompanies.filter(c => c.email).length;
            document.getElementById('with-website').textContent = filteredCompanies.filter(c => c.website).length;
            document.getElementById('dataCount').textContent = filteredCompanies.length;
        }

        // 筛选和搜索功能
        function filterCompanies() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCity = document.getElementById('cityFilter').value;
            const selectedStatus = document.getElementById('statusFilter').value;
            const selectedType = document.getElementById('typeFilter').value;

            let filtered = companies.filter(company => {
                const matchSearch = !searchTerm || 
                    company.name.toLowerCase().includes(searchTerm) ||
                    company.address.toLowerCase().includes(searchTerm) ||
                    company.business.toLowerCase().includes(searchTerm);
                
                const matchCity = !selectedCity || company.city === selectedCity;
                const matchStatus = !selectedStatus || company.status === selectedStatus;
                const matchType = !selectedType || company.type === selectedType;

                return matchSearch && matchCity && matchStatus && matchType;
            });

            renderCompanies(filtered);
            updateStats(filtered);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initCityFilter();
            renderCompanies();
            updateStats();
            
            // 设置当前日期
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN');

            // 绑定搜索和筛选事件
            document.getElementById('searchInput').addEventListener('input', filterCompanies);
            document.getElementById('cityFilter').addEventListener('change', filterCompanies);
            document.getElementById('statusFilter').addEventListener('change', filterCompanies);
            document.getElementById('typeFilter').addEventListener('change', filterCompanies);
        });
    </script>
